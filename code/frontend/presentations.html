<link rel="icon" type="image/jpeg" href="favicon.jpg">`n</head>

  <!-- HEADER -->
  <div class="planning-header">
    <span class="badge">All Deliverables</span>
    <h1 style="font-size: 2.5rem; margin-top: 1rem;">Presentations</h1>
    <p style="color: var(--text-secondary); margin-top: 0.5rem;">All published presentations and deliverables for FOREST.</p>
  </div>

  <!-- PRESENTATIONS LIST (dynamically loaded) -->
  <section class="section" style="max-width: 900px; margin: 0 auto;">
    <div id="presentations-list">
      <p style="color: var(--text-muted); text-align: center;">Loading presentations...</p>
    </div>

  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>FOREST • UCS503 Software Engineering • Thapar University • 2026-27</p>
  </footer>

  <script src="js/config.js"></script>
  <script>
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }

    function parseFiles(value) {
      try {
        const files = JSON.parse(value || '[]');
        return Array.isArray(files) ? files : [];
      } catch (_) {
        return [];
      }
    }

    function downloadUrl(fileUrl) {
      const path = String(fileUrl || '');
      return path.startsWith('/uploads/') ? `${API_BASE_URL}${encodeURI(path)}` : '#';
    }

    // Fetch and display published uploads from the backend
    async function loadPresentations() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/uploads/published`);
        const uploads = await res.json();
        const container = document.getElementById('presentations-list');

        if (uploads.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No additional presentations published yet.</p>';
          return;
        }

        container.innerHTML = uploads.map(upload => {
          const files = parseFiles(upload.files);
          
          const pdfFile = files.find(f => /\.pdf$/i.test(f.originalName));
          const pptFile = files.find(f => /\.pptx?$/i.test(f.originalName));
          
          let fileLinks = '';
          if (pptFile && (pptFile.previewUrl || pptFile.pdfUrl || pdfFile)) {
             const previewUrl = pptFile.previewUrl || pptFile.pdfUrl || pdfFile.url;
             fileLinks = `<a href="viewer.html?file=${encodeURIComponent(pptFile.url)}&previewUrl=${encodeURIComponent(previewUrl)}&name=${encodeURIComponent(upload.title)}" class="btn btn-primary" style="font-size: 0.9rem; padding: 0.5rem 1rem; margin-top: 1rem; display: inline-block;">View Presentation</a>`;
          } else if (pdfFile || pptFile) {
             const fileToView = pdfFile || pptFile;
             fileLinks = `<a href="viewer.html?file=${encodeURIComponent(fileToView.url)}&name=${encodeURIComponent(upload.title)}" class="btn btn-primary" style="font-size: 0.9rem; padding: 0.5rem 1rem; margin-top: 1rem; display: inline-block;">View Presentation</a>`;
          } else {
             fileLinks = files.map(f => `<a href="${escapeHtml(downloadUrl(f.url))}" class="btn btn-outline" style="font-size: 0.9rem; padding: 0.5rem 1rem; margin-top: 1rem; display: inline-block;" target="_blank" rel="noopener">Download ${escapeHtml(f.originalName)}</a>`).join('');
          }

          return `
            <div class="presentation-card card" style="margin-bottom: 1rem;">
              <div>
                <h3 style="font-size: 1.1rem; color: var(--accent-cyan);">${escapeHtml(upload.title)}</h3>
                <div class="meta" style="margin-top: 0.3rem;">
                  <span>${escapeHtml(upload.date)}</span>
                  <span>Version ${escapeHtml(upload.version)}</span>
                  <span>${escapeHtml(upload.deliverable_type)}</span>
                  <span style="color: var(--accent-blue); font-weight: 500;">Uploaded by: ${escapeHtml(upload.author || 'System')}</span>
                </div>
                ${upload.change_summary ? `<p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.8rem;">${escapeHtml(upload.change_summary)}</p>` : ''}
                <div>${fileLinks}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('presentations-list').innerHTML =
          '<p style="color: var(--accent-red); text-align: center;">Could not load presentations. Is the backend running?</p>';
      }
    }

    loadPresentations();
  </script>

  <script src="js/theme.js"></script>
</body>
</html>
