<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOREST Document Viewer</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100dvh; margin: 0; overflow: hidden;
      background: var(--bg-primary, #0b1121); color: var(--text-primary, #fff);
      font-family: Inter, system-ui, sans-serif;
    }
    .viewer-shell { min-height: 100dvh; display: flex; flex-direction: column; position: relative; }
    .viewer-navbar {
      min-height: 64px; display: grid; grid-template-columns: 1fr minmax(0, 2fr) 1fr;
      align-items: center; gap: 1rem; padding: .75rem clamp(1rem, 3vw, 2.5rem);
      background: var(--bg-secondary, #111827); border-bottom: 1px solid var(--border-glass, rgba(255,255,255,.1));
      position: relative; z-index: 2;
    }
    .viewer-navbar a { color: var(--accent-cyan, #28e0aa); text-decoration: none; font-weight: 700; }
    #doc-title { text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    #download-btn { justify-self: end; }
    .viewer-navbar {
      min-height: 64px; display: grid; grid-template-columns: 1fr minmax(0, 2fr) 1fr;
      align-items: center; gap: 1rem; padding: .75rem clamp(1rem, 3vw, 2.5rem);
      background: var(--bg-secondary, #111827); border-bottom: 1px solid var(--border-glass, rgba(255,255,255,.1));
      position: relative; z-index: 2;
    }
    .viewer-navbar a { color: var(--accent-cyan, #28e0aa); text-decoration: none; font-weight: 700; }
    #doc-title { text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    #download-btn { justify-self: end; }
    #viewer-container {
      flex: 1; min-height: 0; position: relative; 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: clamp(.75rem, 2vw, 1.5rem); overflow: hidden;
    }
    #loading-text { margin: 0; max-width: 42rem; padding: 1.5rem; text-align: center; color: var(--text-primary, #fff); line-height: 1.5; }
    #pdf-render { display: none; max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.45); border-radius: 3px; }
    #pdf-controls {
      position: absolute; z-index: 10; bottom: clamp(1rem, 3vw, 2rem); left: 50%; transform: translateX(-50%);
      display: none; align-items: center; gap: .9rem; padding: .6rem .8rem;
      background: rgba(11, 17, 33, 0.7); border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 999px; backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .pdf-btn { width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; font-size: 1.25rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .pdf-btn:hover:not(:disabled), .pdf-btn:focus-visible { background: var(--accent-cyan, #28e0aa); color: #06120e; border-color: var(--accent-cyan, #28e0aa); transform: translateY(-1px); outline: none; }
    .pdf-btn:disabled { opacity: .35; cursor: not-allowed; }
    #page-info { min-width: 6.5rem; text-align: center; font-size: .95rem; font-weight: 700; white-space: nowrap; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    #fullscreen-toggle {
      position: absolute; z-index: 11; top: 1rem; left: 1rem; display: inline-flex; align-items: center; gap: .5rem;
      border: 1px solid rgba(255,255,255,.15); border-radius: .65rem; padding: .65rem .8rem;
      color: #fff; background: rgba(11, 17, 33, 0.7); box-shadow: 0 6px 18px rgba(0,0,0,.4); 
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      cursor: pointer; font: inherit; font-weight: 700; transition: all 0.2s;
    }
    #fullscreen-toggle:hover, #fullscreen-toggle:focus-visible { background: var(--accent-cyan, #28e0aa); color: #06120e; border-color: var(--accent-cyan, #28e0aa); transform: translateY(-1px); outline: none; }
    .viewer-shell:fullscreen, .viewer-shell:-webkit-full-screen { width: 100vw; height: 100vh; min-height: 100vh; background: #000; }
    .viewer-shell:fullscreen .viewer-navbar, .viewer-shell:-webkit-full-screen .viewer-navbar { display: none; }
    .viewer-shell:fullscreen #viewer-container, .viewer-shell:-webkit-full-screen #viewer-container { padding: 0; background: #000; }
    .viewer-shell:fullscreen #pdf-render, .viewer-shell:-webkit-full-screen #pdf-render { border-radius: 0; box-shadow: none; }
      #doc-title { display: none; }
      #viewer-container { padding: .5rem; }
    }
  </style>
</head>
<body>
  <main class="viewer-shell">
    <nav class="viewer-navbar" aria-label="Presentation viewer controls">
      <a href="presentations.html">Back to Presentations</a>
      <span id="doc-title">Loading…</span>
      <a href="#" id="download-btn" target="_blank" rel="noopener">Download File</a>
    </nav>

    <section id="viewer-container" aria-live="polite">
      <button id="fullscreen-toggle" type="button" aria-label="Enter fullscreen">⛶ <span>Full screen</span></button>
      <p id="loading-text">Loading presentation…</p>
      <canvas id="pdf-render" aria-label="Presentation slide"></canvas>
      <div id="pdf-controls" aria-label="Slide navigation">
        <button class="pdf-btn" id="prev-page" type="button" aria-label="Previous slide">❮</button>
        <span id="page-info">Slide <span id="page-num">1</span> / <span id="page-count">1</span></span>
        <button class="pdf-btn" id="next-page" type="button" aria-label="Next slide">❯</button>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const fileUrl = params.get('file');
      // pdfUrl is kept for presentations already uploaded before previewUrl existed.
      const previewUrl = params.get('previewUrl') || params.get('pdfUrl');
      const fileName = params.get('name') || 'Presentation';
      const loadingText = document.getElementById('loading-text');
      const canvas = document.getElementById('pdf-render');
      const context = canvas.getContext('2d', { alpha: false });
      const controls = document.getElementById('pdf-controls');
      const container = document.getElementById('viewer-container');
      const previous = document.getElementById('prev-page');
      const next = document.getElementById('next-page');
      const pageNumber = document.getElementById('page-num');
      const pageCount = document.getElementById('page-count');
      const viewerShell = document.querySelector('.viewer-shell');
      const fullscreenToggle = document.getElementById('fullscreen-toggle');
      let pdfDocument;
      let currentPage = 1;
      let renderTask;
      let renderVersion = 0;
      let resizeTimer;

      function absoluteUrl(relativeUrl) {
        if (!relativeUrl) return '';
        const url = `${API_BASE_URL || ''}${encodeURI(relativeUrl)}`;
        return url.startsWith('/') ? `${window.location.origin}${url}` : url;
      }

      function isPowerPoint(url) { return /\.pptx?$/i.test(url || ''); }

      function showError(message) {
        canvas.style.display = 'none';
        controls.style.display = 'none';
        loadingText.style.display = 'block';
        loadingText.style.color = 'var(--accent-red, #ef4444)';
        loadingText.innerHTML = message;
      }

      function updateControls() {
        previous.disabled = currentPage <= 1;
        next.disabled = currentPage >= pdfDocument.numPages;
        pageNumber.textContent = currentPage;
      }

      async function renderPage(pageToRender) {
        if (!pdfDocument) return;
        const thisRender = ++renderVersion;
        if (renderTask) {
          try { renderTask.cancel(); } catch (_) { /* The next render replaces it. */ }
        }
        const page = await pdfDocument.getPage(pageToRender);
        if (thisRender !== renderVersion) return;
        const unscaled = page.getViewport({ scale: 1 });
        // Use window dimensions to guarantee it never overflows the physical screen real estate.
        // We subtract the navbar height (64px) if not in fullscreen, and subtract 40px for padding.
        const navHeight = isFullscreen() ? 0 : 64;
        const availableWidth = Math.max(1, window.innerWidth - 40);
        const availableHeight = Math.max(1, window.innerHeight - navHeight - 40);
        const scale = Math.min(availableWidth / unscaled.width, availableHeight / unscaled.height);
        const viewport = page.getViewport({ scale });
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;
        context.setTransform(1, 0, 0, 1, 0, 0);
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);

        const task = page.render({
          canvasContext: context,
          viewport,
          transform: outputScale === 1 ? undefined : [outputScale, 0, 0, outputScale, 0, 0],
          background: '#ffffff'
        });
        renderTask = task;
        try {
          await task.promise;
        } catch (error) {
          if (error?.name !== 'RenderingCancelledException') throw error;
        } finally {
          if (renderTask === task) renderTask = null;
        }
      }

      async function changePage(page) {
        if (!pdfDocument || page < 1 || page > pdfDocument.numPages || page === currentPage) return;
        currentPage = page;
        updateControls();
        await renderPage(currentPage);
      }

      function isFullscreen() {
        return document.fullscreenElement === viewerShell || document.webkitFullscreenElement === viewerShell;
      }

      function syncFullscreenButton() {
        const active = isFullscreen();
        fullscreenToggle.innerHTML = active ? '↙ <span>Exit fullscreen</span>' : '⛶ <span>Full screen</span>';
        fullscreenToggle.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => renderPage(currentPage), 100);
      }

      async function toggleFullscreen() {
        try {
          if (isFullscreen()) {
            await (document.exitFullscreen?.() || document.webkitExitFullscreen?.());
          } else {
            await (viewerShell.requestFullscreen?.() || viewerShell.webkitRequestFullscreen?.());
          }
        } catch (error) {
          console.error('Fullscreen request failed:', error);
        }
      }

      async function initialise() {
        if (!localStorage.getItem('forest_token')) {
          document.getElementById('doc-title').textContent = "Private Presentation";
          return showError('<strong>Login Required</strong><br><br>This presentation is private. Please <a href="admin.html" style="color:var(--accent-cyan); text-decoration: underline;">log into the Admin panel</a> to view it.');
        }

        document.getElementById('doc-title').textContent = fileName;
        if (!fileUrl) return showError('No file was selected.');

        const originalUrl = absoluteUrl(fileUrl);
        document.getElementById('download-btn').href = originalUrl;
        const isPdf = /\.pdf$/i.test(fileUrl);
        const viewerSource = isPdf ? originalUrl : absoluteUrl(previewUrl);

        if (isPowerPoint(fileUrl) && !viewerSource) {
          return showError('<strong>This PowerPoint has no presentation preview yet.</strong><br><br>Export the deck to PDF from desktop PowerPoint, upload that PDF together with the PPT/PPTX, then reopen it. This protects the original PowerPoint layout while keeping the FOREST viewer unbranded.');
        }
        if (!isPdf && !isPowerPoint(fileUrl)) return showError('This file format cannot be shown in the presentation viewer.');

        try {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
          pdfDocument = await pdfjsLib.getDocument({ url: viewerSource }).promise;
          pageCount.textContent = pdfDocument.numPages;
          loadingText.style.display = 'none';
          canvas.style.display = 'block';
          controls.style.display = 'flex';
          updateControls();
          await renderPage(currentPage);
        } catch (error) {
          console.error('Viewer failed to load:', error);
          showError('<strong>Unable to load this presentation.</strong><br><br>Download the original file and try again.');
        }
      }

      previous.addEventListener('click', () => changePage(currentPage - 1));
      next.addEventListener('click', () => changePage(currentPage + 1));
      fullscreenToggle.addEventListener('click', toggleFullscreen);
      document.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') { event.preventDefault(); changePage(currentPage - 1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); changePage(currentPage + 1); }
      });
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => renderPage(currentPage), 100);
      });
      document.addEventListener('fullscreenchange', syncFullscreenButton);
      document.addEventListener('webkitfullscreenchange', syncFullscreenButton);
      initialise();
    })();
  </script>
</body>
</html>
